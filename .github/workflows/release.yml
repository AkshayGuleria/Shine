name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Build
        run: |
          xcodebuild \
            -project Shine.xcodeproj \
            -scheme Shine \
            -configuration Release \
            -destination "platform=macOS" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            SYMROOT=build
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Sign app (ad-hoc)
        run: |
          APP=$(find build -name "Shine.app" -maxdepth 4 | head -1)
          echo "Signing: $APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP" && echo "Signature OK"

      - name: Zip app
        run: |
          APP=$(find build -name "Shine.app" -maxdepth 4 | head -1)
          echo "Zipping: $APP"
          ditto -c -k --keepParent "$APP" Shine-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          name: Shine ${{ github.ref_name }}
          body: |
            ## Shine ${{ github.ref_name }}

            ### Install
            1. Download `Shine-${{ github.ref_name }}.zip`
            2. Unzip and move `Shine.app` to `/Applications`
            3. **First launch** — right-click → **Open**, then click Open in the dialog
               - If you see "app is damaged": run `xattr -dr com.apple.quarantine /Applications/Shine.app` in Terminal, then open normally
            4. Grant **Accessibility** permission when prompted

            > This build is ad-hoc signed (no Apple notarization). The quarantine step is a one-time bypass for apps not distributed via the App Store.

            ### Requirements
            macOS 13.0 Ventura or later
          files: Shine-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
