name: CI

on:
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Build
        run: |
          xcodebuild \
            -project Shine.xcodeproj \
            -scheme Shine \
            -configuration Debug \
            -destination "platform=macOS" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            build
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Test
        run: |
          xcodebuild \
            -project Shine.xcodeproj \
            -scheme Shine \
            -destination "platform=macOS" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            test
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
