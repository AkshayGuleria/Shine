name: Shine
options:
  bundleIdPrefix: com.akshayguleria
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.akshayguleria.shine
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  Shine:
    type: application
    platform: macOS
    sources:
      - path: Shine
        excludes:
          - "**/*.entitlements"
    resources:
      - Shine/Resources/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: Shine/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Shine/Shine.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies: []

  ShineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ShineTests
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Shine.app/Contents/MacOS/Shine"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.akshayguleria.shine.tests
    dependencies:
      - target: Shine

schemes:
  Shine:
    build:
      targets:
        Shine: all
        ShineTests: [test]
    test:
      targets:
        - ShineTests
